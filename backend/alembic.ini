[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os

# The URL is intentionally left blank. `alembic/env.py` injects it from
# application settings, so there is exactly one source of truth and the
# password is never written into a file that could be committed.
sqlalchemy.url =

[post_write_hooks]
# Formats and lints each generated revision. `exec` is used because the ruff
# wheel ships a binary rather than a `console_scripts` entrypoint. Separate
# hook names are required because INI forbids repeating an option key.
hooks = ruff_format,ruff_lint
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
